@if (href()) {
  <a
    class="uc-pill uc-pill--link"
    [class.uc-pill--info]="variant() === 'info'"
    [class.uc-pill--valid]="variant() === 'valid'"
    [class.uc-pill--error]="variant() === 'error'"
    [class.uc-pill--compact]="size() === 'compact'"
    [href]="href()"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="uc-pill__label"><ng-content>{{ text() }}</ng-content></span>
  </a>
} @else {
  <div
    class="uc-pill"
    [class.uc-pill--info]="variant() === 'info'"
    [class.uc-pill--valid]="variant() === 'valid'"
    [class.uc-pill--error]="variant() === 'error'"
    [class.uc-pill--compact]="size() === 'compact'"
    [class.uc-pill--clickable]="isClickable()"
    (click)="clicked.emit()"
  >
    <span class="uc-pill__label"><ng-content>{{ text() }}</ng-content></span>
  </div>
}
