<div class="uc-toast-outlet" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="uc-toast"
      [class]="'uc-toast--' + toast.variant"
      [attr.role]="toast.variant === 'error' ? 'alert' : 'status'"
      animate.enter="uc-toast--entering"
      animate.leave="uc-toast--leaving"
    >
      <i class="uc-toast__icon ph" [class]="iconFor(toast.variant)" aria-hidden="true"></i>
      <div class="uc-toast__content">
        @if (toast.title) {
          <p class="uc-toast__title">{{ toast.title }}</p>
        }
        <p class="uc-toast__message">{{ toast.message }}</p>
        @if (toast.positiveAction || toast.negativeAction) {
          <div class="uc-toast__actions">
            @if (toast.negativeAction; as action) {
              <uc-button
                [text]="action.text"
                [variant]="'text'"
                [size]="'small'"
                (clicked)="toastService.runAction(toast.id, action)"
              />
            }
            @if (toast.positiveAction; as action) {
              <uc-button
                [text]="action.text"
                [variant]="'primary'"
                [size]="'small'"
                (clicked)="toastService.runAction(toast.id, action)"
              />
            }
          </div>
        }
      </div>
      <button
        type="button"
        class="uc-toast__close"
        [attr.aria-label]="closeLabel()"
        (click)="toastService.dismiss(toast.id)"
      >
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </div>
  }
</div>
