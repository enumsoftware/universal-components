@if (!previewUrl() && !selectedFile()) {
  <div
    class="uc-file-picker__dropzone"
    [class.uc-file-picker__dropzone--active]="isDragging()"
    [class.uc-file-picker__dropzone--disabled]="disabled()"
    (click)="triggerSelect()"
  >
    <span class="uc-file-picker__dropzone-text">{{ dropzoneText() }}</span>
  </div>
}

<input
  #fileInput
  [id]="id()"
  class="uc-file-picker__input"
  type="file"
  [title]="label()"
  [attr.aria-label]="label()"
  [accept]="accept()"
  [disabled]="disabled()"
  (change)="onFileChange($event)"
/>

@if (previewUrl()) {
  <div class="uc-file-picker-preview">
    <uc-icon-button
      class="uc-clear-button"
      [phosphorIcon]="'x-circle'"
      [variant]="'error'"
      [label]="removeLabel()"
      (clicked)="clearSelection()"
    />
    <img [src]="previewUrl()" [alt]="previewAlt()" />
  </div>
} @else if (selectedFile(); as file) {
  @if (!isImage()) {
    <div class="uc-file-picker__file">
      <uc-phosphor-icon class="uc-file-picker__file-icon" [icon]="fileIcon()" />
      <div class="uc-file-picker__file-details">
        <span class="uc-file-picker__filename" [title]="file.name">{{ file.name }}</span>
        <span class="uc-file-picker__file-size">{{ fileSize() }}</span>
      </div>
      <uc-icon-button
        class="uc-file-picker__file-remove"
        [phosphorIcon]="'x-circle'"
        [variant]="'error'"
        [label]="removeLabel()"
        [disabled]="disabled()"
        (clicked)="clearSelection()"
      />
    </div>
  }
}

@if (helperText()) {
  <p class="uc-file-picker__helper">{{ helperText() }}</p>
}

@if (errorMessage()) {
  <p class="uc-file-picker__error" aria-live="polite">{{ errorMessage() }}</p>
}
