name: Workbench

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workbench-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Token parity
        run: npm run tokens:check

      # The generators run on Node's native type stripping, which silently
      # accepts syntax tsc would reject. This is the only thing checking them.
      - name: Typecheck scripts
        run: npm run scripts:typecheck

      - name: Build workbench
        run: npm run workbench:build

      # Only Chromium: the sweep measures rendered colour, and one engine is
      # what the baseline was recorded against.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility sweep
        run: npm run a11y

      - uses: actions/configure-pages@v6
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-pages-artifact@v5
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: dist-workbench/browser

  # Only version tags (v*) publish. Pushes to main and pull requests run the
  # checks above but deploy nothing.
  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploys the artifact `build` already uploaded, so the site that ships is
      # byte-for-byte the one the accessibility sweep passed against.
      - id: deployment
        uses: actions/deploy-pages@v5
