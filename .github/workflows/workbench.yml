name: Workbench

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: workbench-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Token parity
        run: npm run tokens:check

      # The generators run on Node's native type stripping, which silently
      # accepts syntax tsc would reject. This is the only thing checking them.
      - name: Typecheck scripts
        run: npm run scripts:typecheck

      - name: Build workbench
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run workbench:build -- --base-href "/universal-components/pr-preview/pr-${{ github.event.pull_request.number }}/"
          else
            npm run workbench:build
          fi

      # Only Chromium: the sweep measures rendered colour, and one engine is
      # what the baseline was recorded against.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility sweep
        run: npm run a11y

      - name: Stage Pages artifact
        run: |
          rm -rf dist-pages
          mkdir -p dist-pages
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            preview_path="pr-preview/pr-${{ github.event.pull_request.number }}"
            mkdir -p "dist-pages/${preview_path}"
            cp -R dist-workbench/browser/. "dist-pages/${preview_path}/"
          else
            cp -R dist-workbench/browser/. dist-pages/
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'github-pages' || 'github-pages-preview' }}
      url: ${{ github.event_name == 'pull_request' && format('{0}pr-preview/pr-{1}/', steps.deployment.outputs.page_url, github.event.pull_request.number) || steps.deployment.outputs.page_url }}
    steps:
      # Deploys the artifact `build` already uploaded, so the site that ships is
      # byte-for-byte the one the accessibility sweep passed against.
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          preview: ${{ github.event_name == 'pull_request' }}
