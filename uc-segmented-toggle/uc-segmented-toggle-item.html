<button
  type="button"
  class="uc-segmented-toggle-item__button"
  [class.uc-segmented-toggle-item__button--selected]="selected()"
  [class.uc-segmented-toggle-item__button--disabled]="isDisabled()"
  [class.uc-segmented-toggle-item__button--pills]="pills()"
  [disabled]="isDisabled()"
  role="radio"
  aria-checked="false"
  [attr.aria-checked]="selected()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-disabled]="isDisabled()"
  (click)="onClick($event)"
>
  @if (icon(); as icon) {
    <uc-phosphor-icon class="uc-segmented-toggle-item__icon" [icon]="icon" [weight]="iconWeight()" />
  }
  <ng-content select="[ucSegmentedTogglePrefix]"></ng-content>
  <ng-content></ng-content>
</button>
