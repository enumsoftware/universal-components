@if (totalItems() > 0 && !hidden()) {
  <div class="uc-pagination-container">
    <div class="uc-pagination">
      <uc-pagination-page-button
        class="uc-pagination__btn uc-pagination__btn--fast"
        [ariaLabel]="jumpBackwardText()"
        [phosphorIcon]="'caret-double-left'"
        [variant]="'secondary'"
        [size]="size()"
        [disabled]="isFastPreviousDisabled()"
        (clicked)="fastPreviousPage()"
      />

      <uc-pagination-page-button
        class="uc-pagination__btn"
        [ariaLabel]="previousPageLabel()"
        [phosphorIcon]="'caret-left'"
        [variant]="'primary'"
        [size]="size()"
        [disabled]="isPreviousDisabled()"
        (clicked)="previousPage()"
      />

      <!-- The current page is disabled as well as pressed, so clicking it can never flip the
           toggle off while the page itself stays current. -->
      <div class="uc-pagination__indicators">
        @for (page of visiblePages(); track $index) {
          <uc-button
            class="uc-pagination__page-btn"
            [class.uc-pagination__page-btn--current]="currentPage() === page"
            [text]="(page + 1).toString()"
            [size]="size()"
            isToggleEnabled
            [pressed]="currentPage() === page"
            [disabled]="currentPage() === page"
            (clicked)="goToPage(page)"
          />
        }

        @if (showLastPageShortcut()) {
          <span class="uc-pagination__ellipsis" aria-hidden="true">...</span>
          <uc-button
            class="uc-pagination__page-btn"
            [class.uc-pagination__page-btn--current]="currentPage() === lastPageIndex()"
            [text]="(lastPageIndex() + 1).toString()"
            [size]="size()"
            isToggleEnabled
            [pressed]="currentPage() === lastPageIndex()"
            [disabled]="currentPage() === lastPageIndex()"
            (clicked)="goToPage(lastPageIndex())"
          />
        }
      </div>

      <uc-pagination-page-button
        class="uc-pagination__btn"
        [ariaLabel]="nextPageLabel()"
        [phosphorIcon]="'caret-right'"
        [variant]="'primary'"
        [size]="size()"
        [disabled]="isNextDisabled()"
        (clicked)="nextPage()"
      />

      <uc-pagination-page-button
        class="uc-pagination__btn uc-pagination__btn--fast"
        [ariaLabel]="jumpForwardText()"
        [phosphorIcon]="'caret-double-right'"
        [variant]="'secondary'"
        [size]="size()"
        [disabled]="isFastNextDisabled()"
        (clicked)="fastNextPage()"
      />
    </div>

    @if (showPageInfo() || showPageSelector()) {
      <div
        class="uc-pagination__meta"
        [class.uc-pagination__meta--split]="showPageInfo() && showPageSelector()"
      >
        @if (showPageInfo()) {
          <div class="uc-pagination__info">
            {{ pageInfoText() }}
          </div>
        }

        @if (showPageSelector()) {
          <uc-pagination-page-select
            [selectedSize]="pageSize()"
            [sizes]="pageSizeOptions()"
            [label]="pageSizeLabel()"
            [ariaLabel]="pageSizeSelectLabel()"
            [size]="size()"
            (sizeSelected)="onPageSizeSelect($event)"
          />
        }
      </div>
    }
  </div>
}
