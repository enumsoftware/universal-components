<div class="wb-brand">
  <div>
    <strong>Universal Components</strong>
    <span>Workbench</span>
  </div>

  <!-- Drawer affordance: hidden above the breakpoint, where the sidebar is a
       permanent column with nothing to dismiss. -->
  <uc-icon-button
    class="wb-drawer-close"
    phosphorIcon="x"
    label="Close navigation"
    variant="secondary"
    (clicked)="open.set(false)"
  />
</div>

<uc-input
  [id]="'wb-filter'"
  label="Filter showcases"
  [hideLabel]="true"
  placeholder="Filter…"
  [value]="query()"
  (valueChange)="onQuery($event)"
/>

<nav>
  @for (group of groups(); track group.name) {
  <section>
    <h2>{{ group.name }}</h2>
    @for (entry of group.entries; track entry.id) {
    <uc-sidebar-button [text]="entry.title" [active]="activeId() === entry.id" (clicked)="select(entry.id)" />
    }
  </section>
  } @empty {
  <p class="wb-empty">No match.</p>
  }
</nav>

<!-- A div rather than a <footer>: see the note in app.ts on chrome landmarks. -->
<div class="wb-sidebar-footer">
  <uc-divider />
  <uc-select
    [id]="'wb-chrome-theme'"
    label="App theme"
    [options]="themeOptions"
    [value]="theme.chrome()"
    (valueChange)="onChromeTheme($event)"
  />
</div>
